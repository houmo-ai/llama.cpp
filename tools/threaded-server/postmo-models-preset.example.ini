[qwen-64k-vl]
model = /models/qwen-64k-vl.gguf
alias = qwen-64k-vl
parallel = 2
load-on-startup = true
slot-save-path = /data/llama/checkpoints
slot-checkpoint-max-count = 2
slot-checkpoint-every-n-tokens = 0
slot-checkpoint-triggers = explicit
server-warmup-system-prompt-file = /data/llama/prompts/vl-system.txt

[qwen-16k-text]
model = /models/qwen-16k-text.gguf
alias = qwen-16k-text
parallel = 8
load-on-startup = true
slot-save-path = /data/llama/checkpoints
slot-checkpoint-max-count = 2
slot-checkpoint-every-n-tokens = 0
slot-checkpoint-triggers = explicit

# To restore a previously-created system checkpoint on startup, add these
# options to the target preset:
#
# slot-checkpoint-preload-session = agent-42
# slot-checkpoint-preload-name = system_prompt_end
# slot-checkpoint-preload-slot = 0
